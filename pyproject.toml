[project]
name = "countersign"
version = "0.1.0"
description = "Countersign: agents prepare, humans sign, nobody signs alone (a Switch agent)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "pypdf>=5.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fpdf2>=2.8",
    "types-PyYAML",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# design.md §2 requires the multiplication sign in "5.0× the usual"
"src/countersign/chat/render.py" = ["RUF001"]
# expected chat text copied from design.md is long on purpose
"tests/**" = ["E501", "RUF001"]
